version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automotors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-automotors123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automotors"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET:-automotors-secret-key-2026}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: automotors
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-automotors123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3006:80"
    depends_on:
      - backend

volumes:
  pgdata:
